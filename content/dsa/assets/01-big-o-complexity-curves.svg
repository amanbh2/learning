<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" style="max-width: 920px; height: auto; display: block; margin: 1.5rem auto;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Container Box -->
  <rect width="100%" height="100%" rx="12" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Chart Header -->
  <text x="460" y="42" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Asymptotic Complexity &amp; Big-O Operational Growth</text>
  <text x="460" y="65" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Systems &amp; Real-Time Engineering Perspective: Hardware Latency vs Input Scaling</text>

  <!-- Complexity Threshold Zone Highlights -->
  <!-- Horrible Zone (Top-Left) -->
  <path d="M 120 90 L 400 90 L 120 370 Z" fill="#f43f5e" fill-opacity="0.08"/>
  <text x="210" y="140" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#f43f5e" opacity="0.6">UNACCEPTABLE IN REAL-TIME RAN</text>

  <!-- Excellent Zone (Bottom-Right) -->
  <path d="M 120 440 L 840 440 L 840 370 L 120 440 Z" fill="#34d399" fill-opacity="0.06"/>
  <text x="660" y="425" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#34d399" opacity="0.7">OPTIMAL LINEAR &amp; SUB-LINEAR REGIME</text>

  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4,4">
    <line x1="120" y1="370" x2="840" y2="370"/>
    <line x1="120" y1="300" x2="840" y2="300"/>
    <line x1="120" y1="230" x2="840" y2="230"/>
    <line x1="120" y1="160" x2="840" y2="160"/>
    <line x1="300" y1="440" x2="300" y2="90"/>
    <line x1="480" y1="440" x2="480" y2="90"/>
    <line x1="660" y1="440" x2="660" y2="90"/>
  </g>

  <!-- Axes -->
  <line x1="120" y1="440" x2="850" y2="440" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="120" y1="440" x2="120" y2="80" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Axis Labels -->
  <text x="830" y="470" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">Input Elements (n) →</text>
  <text x="60" y="100" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle" transform="rotate(-90 60 100)">Operations / Latency →</text>

  <!-- Curves -->
  <!-- O(1) Constant -->
  <path d="M 120 420 L 820 420" stroke="#34d399" stroke-width="3" fill="none"/>
  <text x="830" y="416" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#34d399">O(1)</text>

  <!-- O(log n) Logarithmic -->
  <path d="M 120 440 Q 150 410, 240 395 T 480 375 T 820 355" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <text x="830" y="352" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#38bdf8">O(log n)</text>

  <!-- O(n) Linear -->
  <path d="M 120 440 L 780 270" stroke="#a855f7" stroke-width="3" fill="none"/>
  <text x="790" y="265" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#a855f7">O(n)</text>

  <!-- O(n log n) Linearithmic -->
  <path d="M 120 440 Q 300 370, 500 280 T 700 130" stroke="#fbbf24" stroke-width="3" fill="none"/>
  <text x="710" y="125" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#fbbf24">O(n log n)</text>

  <!-- O(n^2) Quadratic -->
  <path d="M 120 440 Q 240 410, 360 280 T 450 95" stroke="#f97316" stroke-width="3" fill="none"/>
  <text x="460" y="90" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#f97316">O(n²)</text>

  <!-- O(2^n) Exponential -->
  <path d="M 120 440 Q 180 430, 220 320 T 255 95" stroke="#f43f5e" stroke-width="3.5" fill="none"/>
  <text x="260" y="90" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#f43f5e">O(2ⁿ)</text>

  <!-- Legend / Bottom Card -->
  <rect x="120" y="475" width="700" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="145" cy="497" r="5" fill="#34d399"/>
  <text x="160" y="501" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#f8fafc">Direct Array Index / Hash lookup</text>

  <circle cx="340" cy="497" r="5" fill="#38bdf8"/>
  <text x="355" y="501" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#f8fafc">Binary Search</text>

  <circle cx="455" cy="497" r="5" fill="#a855f7"/>
  <text x="470" y="501" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#f8fafc">Single-Pass Scan</text>

  <circle cx="585" cy="497" r="5" fill="#fbbf24"/>
  <text x="600" y="501" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#f8fafc">QuickSort / MergeSort</text>

  <circle cx="735" cy="497" r="5" fill="#f43f5e"/>
  <text x="750" y="501" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#f8fafc">Subsets / Permutations</text>
</svg>
